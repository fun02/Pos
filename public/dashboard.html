<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Enterprise Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <!-- Loading State (Ditampilkan saat mengecek sesi) -->
    <div id="loading-screen" class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-400">Memverifikasi sesi...</p>
    </div>

    <!-- Dashboard Content (Disembunyikan sampai sesi tervalidasi) -->
    <main id="dashboard-content" class="hidden glass-card w-full max-w-2xl rounded-2xl p-8 z-10 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-500/10 mb-4">
            <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Selamat Datang di Dashboard!</h1>
        <p class="text-slate-400 mb-1">Anda login sebagai:</p>
        <p id="user-email" class="text-indigo-400 font-medium text-lg mb-8"></p>

        <button id="btn-logout" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/50 px-6 py-2.5 rounded-lg text-sm font-medium transition duration-200">
            Log Out Securely
        </button>
    </main>
<!-- Tambahkan ini di dalam <aside id="sidebar"> bagian bawah -->
<div class="p-3 border-t border-slate-200 dark:border-slate-700 mt-auto">
    <button id="btn-logout" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors font-medium">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
    </button>
</div>

    <!-- Firebase SDK & Session Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 1. MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        // (Gunakan konfigurasi yang sama persis dengan yang ada di index.html)
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "fungrow-app.firebaseapp.com",
            projectId: "fungrow-app",
            storageBucket: "fungrow-app.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Referensi Elemen UI
        const loadingScreen = document.getElementById('loading-screen');
        const dashboardContent = document.getElementById('dashboard-content');
        const userEmailDisplay = document.getElementById('user-email');
        const btnLogout = document.getElementById('btn-logout');

        // 2. LISTENER STATUS AUTENTIKASI (Route Protection)
        // Fungsi ini akan otomatis berjalan saat halaman dimuat
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Jika user memiliki sesi yang valid
                loadingScreen.classList.add('hidden');
                dashboardContent.classList.remove('hidden');
                dashboardContent.classList.add('block');
                
                // Tampilkan email user
                userEmailDisplay.textContent = user.email;
            } else {
                // Jika user tidak login atau sesi kedaluwarsa, tendang kembali ke halaman login
                window.location.replace('/index.html');
            }
        });

        // 3. FUNGSI LOGOUT
        btnLogout.addEventListener('click', async () => {
            try {
                // Nonaktifkan tombol saat proses
                btnLogout.disabled = true;
                btnLogout.textContent = "Logging out...";
                
                await signOut(auth);
                // Setelah sign out berhasil, onAuthStateChanged akan otomatis mendeteksinya
                // dan menendang user ke index.html
            } catch (error) {
                console.error("Logout Error:", error);
                alert("Gagal melakukan logout.");
                btnLogout.disabled = false;
                btnLogout.textContent = "Log Out Securely";
            }
        });
    </script>
    <!-- FIREBASE AUTH & FIRESTORE INTEGRATION -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. KONFIGURASI FIREBASE (Samakan dengan yang ada di index.html)
    const firebaseConfig = {
        apiKey: "AIzaSyB4lkr5IzvrQIgRM7sZDO7yIKMU_16PE1U",
        authDomain: "https://faan02.firebaseapp.com",
        projectId: "faan02",
        storageBucket: "https://faan02.firebasestorage.app",
        messagingSenderId: "1060452885464",
        appId: "1:1060452885464:web:175c75a2cfde51e72b48ad"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 2. PROTEKSI HALAMAN & AMBIL DATA PROFIL
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // Jika user login, ambil data profilnya dari Firestore
            try {
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    // Update UI POS dengan data user dari database
                    const userNameEl = document.getElementById('user-name');
                    const userAvatarEl = document.getElementById('user-avatar');
                    const currentRoleEl = document.getElementById('current-role');

                    if(userNameEl) userNameEl.textContent = userData.fullName || userData.username;
                    if(userAvatarEl) {
                        // Ambil huruf pertama dari nama untuk Avatar
                        const initial = (userData.fullName || userData.username || 'U').charAt(0).toUpperCase();
                        userAvatarEl.textContent = initial;
                    }
                    if(currentRoleEl) {
                        // Kapitalisasi huruf pertama dari role (misal: "admin" -> "Admin")
                        const role = userData.role || 'Kasir';
                        currentRoleEl.textContent = role.charAt(0).toUpperCase() + role.slice(1);
                        
                        // Opsional: Anda bisa memanggil fungsi renderNav() milik POS di sini
                        // untuk menyesuaikan menu berdasarkan role Firebase
                        // App.currentRole = userData.role;
                        // App.renderNav();
                    }
                }
            } catch (error) {
                console.error("Gagal mengambil data user:", error);
            }
        } else {
            // Jika user tidak login, langsung tendang ke halaman login (index.html)
            window.location.replace('/index.html');
        }
    });

    // 3. FUNGSI LOGOUT (Tambahkan tombol logout di UI POS Anda)
    // Asumsi: Anda akan menambahkan tombol dengan id="btn-logout" di sidebar atau top nav POS
    const btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
        btnLogout.addEventListener('click', async (e) => {
            e.preventDefault();
            
            // Menggunakan fungsi konfirmasi bawaan POS Anda (App.confirm) atau confirm standar
            if(confirm("Apakah Anda yakin ingin keluar?")) {
                try {
                    await signOut(auth);
                    // onAuthStateChanged akan otomatis menendang user ke index.html
                } catch (error) {
                    alert("Gagal melakukan logout.");
                }
            }
        });
    }
</script>

</body>
</html>
